<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <header class="header" style="position: sticky; top: 0; z-index: 1000; background-color: var(--background);">

    <a href="index.html">
      <img id="Logo" src="logo.png" alt="Coffee spot logo">
    </a>

    <div class="home-button">
      <a href="index.html" id="home-button"> Home </a>
    </div>

    <div class="Menu-button">
      <a href="menu.html" id="Menu-button"> Menu </a>
    </div>

    <div class="About-button">
      <a href="about.html" id="About-button"> About </a>
    </div>

    <div class="Contact-button">
      <a href="contact.html" id="Contact-button"> Contact </a>
    </div>

    <div class="Visit-Us">
      <a href="contact.html" id="Visit-Us">
        <button class="btn-primary" style="border-radius: 5em; width:6em; height: 3em;"> Visit us</button>
      </a>
    </div>

  </header>

  <main class="contact-page">
    <span class="eyebrow">Get in touch</span>

    <h1>Visit The Coffee Spot</h1>

    <div class="contact-card">
      <div class="contact-row">
        <img class="svg" src="map-pin.svg" alt="location">
        <h4> Zambezi Drive, Kolonnade Shopping Centre 0151 Pretoria, South Africa</h4>
      </div>

      <div class="contact-row">
        <img class="svg" src="phone.svg" alt="phone number">
        <h4>012 548 4951</h4>
      </div>

      <div class="contact-row">
        <img class="svg" src="clock.svg" alt="Opening & closing times">
        <h4> Mon - Fri: 08:00-19:00</h4>
        <h4> Saturday: 08:00-18:00</h4>
        <h4> Sunday: 08:00-16:00</h4>
      </div>

      <div class="contact-row">
        <img class="svg" src="mail.svg" alt="email">
        <h4>coffeespotghl@outlook.com</h4>
      </div>
    </div>
  </main>

</body>
</html>
